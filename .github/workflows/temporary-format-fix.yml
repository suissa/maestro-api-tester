name: Temporary formatting repair

on:
  push:
    branches:
      - fix/prettier-build-formatting
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prettier-build-formatting
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write dashboard/index.tsx dashboard/tests.tsx packages/tui/maestro-tui/package.json src/api-tester.ts src/server.ts tests/api.test.ts
      - run: npm run build
      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dashboard/index.tsx dashboard/tests.tsx packages/tui/maestro-tui/package.json src/api-tester.ts src/server.ts tests/api.test.ts
            git commit -m "style: apply Prettier formatting"
            git push
          fi
