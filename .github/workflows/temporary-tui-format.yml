name: Temporary TUI formatter

on:
  push:
    branches:
      - feat/tui-test-execution-dashboard

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tui-test-execution-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write packages/tui/maestro-tui/src/index.tsx
      - name: Commit formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/tui/maestro-tui/src/index.tsx
            git commit -m "style: apply Prettier to TUI dashboard"
            git push
          fi
