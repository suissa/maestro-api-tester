name: Temporary advanced source formatter

on:
  push:
    branches:
      - main
    paths:
      - "src/advanced-tests.ts"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write src/advanced-tests.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/advanced-tests.ts
          git commit -m "style: format advanced test option parsing"
          git push origin HEAD:main
