name: Temporary advanced tests formatter

on:
  push:
    branches:
      - feat/advanced-test-types
    paths:
      - "tests/advanced-tests.integration.test.ts"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/advanced-test-types
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write tests/advanced-tests.integration.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/advanced-tests.integration.test.ts
          git commit -m "style: format advanced test integration tests"
          git push origin HEAD:feat/advanced-test-types
